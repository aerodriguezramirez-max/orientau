<html lang="es">
<head>

  <link rel="stylesheet" href="styles.css">
  <!-- Supabase (reemplaza las llamadas a login.php / register.php / etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabaseClient.js"></script>
  <!-- Google Identity Services (botón "Continuar con Google") -->
  <!-- Google Sign-In desactivado por ahora
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  -->
  <!-- Three.js (modelo 3D "Graduation Ascension" del logo) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="model3d.js"></script>
  <style>
    body { background: radial-gradient(ellipse at 25% 15%, #070f24, #060b18 55%, #060e1e 100%); }

    /* ── Logo 3D flotante interactivo ────────────────────────── */
    .logo-wrap { text-align: center; margin-bottom: 28px; user-select: none; }

    .logo3d-login-stage {
      width: 160px; height: 160px;
      margin: 0 auto 16px;
      position: relative;
      perspective: 700px;
      cursor: grab;
    }
    .logo3d-login-stage:active { cursor: grabbing; }

    /* Anillo exterior giratorio */
    .logo-ring-outer {
      position: absolute; inset: -16px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: rgba(79,142,247,0.6);
      border-right-color: rgba(0,150,255,0.3);
      animation: ringSpinLogin 4s linear infinite;
      pointer-events: none;
    }
    .logo-ring-inner {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-bottom-color: rgba(120,60,255,0.5);
      border-left-color: rgba(79,142,247,0.2);
      animation: ringSpinLogin 6s linear infinite reverse;
      pointer-events: none;
    }
    @keyframes ringSpinLogin { to { transform: rotate(360deg); } }

    /* Glow pulsante debajo */
    .logo-glow-floor {
      position: absolute;
      bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 22px;
      background: radial-gradient(ellipse, rgba(0,150,255,0.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: glowFloor 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes glowFloor {
      0%,100% { opacity:.7; transform: translateX(-50%) scaleX(1); }
      50%      { opacity:.3; transform: translateX(-50%) scaleX(.65); }
    }

    /* La imagen en sí */
    .logo3d-img-wrap {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.08s linear;
      will-change: transform;
      /* Animación idle (se pausa con JS cuando hay mouse) */
      animation: logoIdleFloat 5s ease-in-out infinite;
    }
    .logo3d-img-wrap.mouse-active { animation: none; }

    @keyframes logoIdleFloat {
      0%   { transform: perspective(700px) rotateX(0deg)   rotateY(0deg)   translateY(0px); }
      25%  { transform: perspective(700px) rotateX(6deg)   rotateY(12deg)  translateY(-8px); }
      50%  { transform: perspective(700px) rotateX(-4deg)  rotateY(-10deg) translateY(-14px); }
      75%  { transform: perspective(700px) rotateX(5deg)   rotateY(8deg)   translateY(-6px); }
      100% { transform: perspective(700px) rotateX(0deg)   rotateY(0deg)   translateY(0px); }
    }

    .logo3d-img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter:
        drop-shadow(0 0 18px rgba(0,150,255,0.6))
        drop-shadow(0 4px 30px rgba(0,0,0,0.5))
        brightness(1.05) contrast(1.05);
      transform: translateZ(0);
    }

    /* ── Modelo 3D real (Three.js), reemplaza la <img> plana ────── */
    .logo3d-canvas {
      width: 100%; height: 100%;
      display: block;
      opacity: 0;
      transition: opacity .6s ease;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,0.45));
    }
    .logo3d-canvas.is-ready { opacity: 1; }

    .logo3d-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 4;
      pointer-events: none;
    }
    .logo3d-loader .m3d-spinner {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(144,202,249,.18);
      border-top-color: var(--blue-400);
      animation: spin .9s linear infinite;
    }

    /* Partículas sparkle login */
    .login-sparks { position: absolute; inset: -20px; pointer-events: none; }
    .spark {
      position: absolute; width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--c, #4f8ef7);
      animation: sparkFloat var(--d,4s) ease-in-out infinite;
      animation-delay: var(--dl,0s);
      opacity: 0;
    }
    .sk1{top:10%;left:15%;  --c:#4f8ef7;--d:3.5s;--dl:.0s;}
    .sk2{top:5%; right:20%; --c:#4299e1;--d:4.2s;--dl:.8s;}
    .sk3{bottom:20%;left:10%;--c:#7c3aed;--d:3.8s;--dl:1.2s;}
    .sk4{bottom:10%;right:15%;--c:#4f8ef7;--d:4.5s;--dl:.4s;}
    .sk5{top:45%;left:2%;   --c:#f59e0b;--d:3.2s;--dl:1.8s;}
    .sk6{top:50%;right:3%;  --c:#4299e1;--d:4.0s;--dl:.6s;}
    @keyframes sparkFloat {
      0%   { opacity:0; transform:translateY(0) scale(0); }
      20%  { opacity:1; transform:translateY(-8px) scale(1); }
      80%  { opacity:.6; transform:translateY(-20px) scale(.7); }
      100% { opacity:0; transform:translateY(-30px) scale(0); }
    }

    .logo-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px; font-weight: 900; color: #fff;
    }
    .logo-title span { color: #4f8ef7; text-shadow: 0 0 16px rgba(79,142,247,0.5); }
    .logo-sub { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
                color: rgba(148,163,184,0.55); margin-top: 6px; }

    /* btn overrides */
    .btn-ghost { background:transparent; color:#4f8ef7; border:1.5px solid rgba(0,212,170,.4); font-weight:600; }
    .btn-ghost:hover { background:rgba(0,212,170,.08); border-color:#4f8ef7; }
    .tab-btn.active { border-bottom-color:#4f8ef7 !important; color:#4f8ef7 !important; }
  </style>
</head>
<body>
<div class="particles" id="particles"></div>
<canvas id="particleCanvas"></canvas>
<script>
(function(){
  const canvas = document.getElementById('particleCanvas');
  if(!canvas) return;
  canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.4';
  const ctx = canvas.getContext('2d');
  let W=canvas.width=window.innerWidth, H=canvas.height=window.innerHeight;
  window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});
  const pts=[];
  for(let i=0;i<40;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1});
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(79,142,247,0.5)';ctx.fill();});
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<130){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(79,142,247,${.15*(1-d/130)})`;ctx.lineWidth=.7;ctx.stroke();}}
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<script>
/* ── Logo 3D mouse tracking – Login ──────────────────────────── */
(function(){
  const stage = document.getElementById('loginLogoStage');
  const wrap  = document.getElementById('loginLogoWrap');
  if(!stage || !wrap) return;

  const MAX_ROT = 26; // grados máx
  let raf = null;
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  let inside = false;

  stage.addEventListener('mousemove', e => {
    inside = true;
    wrap.classList.add('mouse-active');
    const r  = stage.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width  / 2)) / (r.width  / 2);
    const dy = (e.clientY - (r.top  + r.height / 2)) / (r.height / 2);
    targetX =  dy * -MAX_ROT;   // rotateX inverted
    targetY =  dx *  MAX_ROT;   // rotateY
    startRAF();
  });

  stage.addEventListener('mouseleave', () => {
    inside  = false;
    targetX = 0; targetY = 0;
    // let lerp ease back, then restore idle animation
    setTimeout(() => {
      if(!inside) wrap.classList.remove('mouse-active');
    }, 700);
  });

  /* Also respond to global mouse for subtle parallax even outside card */
  document.addEventListener('mousemove', e => {
    if(inside) return;
    const cx = window.innerWidth  / 2;
    const cy = window.innerHeight / 2;
    const dx = (e.clientX - cx) / cx;
    const dy = (e.clientY - cy) / cy;
    targetX = dy * -(MAX_ROT * 0.35);
    targetY = dx *  (MAX_ROT * 0.35);
  });

  function startRAF(){
    if(raf) return;
    raf = requestAnimationFrame(tick);
  }
  function tick(){
    currentX += (targetX - currentX) * 0.12;
    currentY += (targetY - currentY) * 0.12;
    wrap.style.transform =
      `perspective(700px) rotateX(${currentX.toFixed(2)}deg) rotateY(${currentY.toFixed(2)}deg) scale(1.04)`;
    const dX = Math.abs(targetX - currentX);
    const dY = Math.abs(targetY - currentY);
    if(dX < 0.05 && dY < 0.05 && !inside){ raf = null; return; }
    raf = requestAnimationFrame(tick);
  }
})();
</script>
